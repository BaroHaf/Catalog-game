name: Release Canary

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE.md"
      - "scripts/**"
      # ⚠️ Nếu để dòng này thì khi chỉ sửa file .github/** workflow sẽ không chạy
      # - ".github/**"
  pull_request:
    branches: [main]
  release:
    types: [released, prereleased]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: canary_environment
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cài Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cài pnpm (không auto install)
      - run: npm i -g pnpm@9.2.0

      # Cài dependencies
      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      # Setup RoKit/Mantle
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Compile TypeScript nếu có script "build"
      - name: Compile
        run: |
          if pnpm run | grep -qE '^\s*build\s*$'; then
            pnpm run build --verbose
          else
            echo "No build script. Skipping compile."
          fi

      # Build project với Rojo
      - name: Build project
        run: rojo build default.project.json --output place.rbxlx

      # Upload artifact
      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: place
          path: place.rbxlx

  deploy:
    runs-on: self-hosted
    needs: build
    environment: canary
    # Chỉ deploy khi release hoặc bấm tay
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Download place artifact
        uses: actions/download-artifact@v4
        with:
          name: place

      - name: Deploy game
        run: mantle deploy --allow-purchases --environment canary
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          MANTLE_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          MANTLE_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MANTLE_OPEN_CLOUD_API_KEY: ${{ secrets.MANTLE_OPEN_CLOUD_API_KEY }}
